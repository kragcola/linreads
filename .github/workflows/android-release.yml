name: Android Dev Release

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-release.yml"
  workflow_dispatch:
    inputs:
      publish_ota:
        description: "Publish the verified APKs to dev-latest"
        required: true
        default: false
        type: boolean

concurrency:
  group: android-dev-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      BUILD_VERSION_BASE: 100000
      KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
      STORE_PASSWORD: android
      KEY_ALIAS: androiddebugkey
      KEY_PASSWORD: android
      GITHUB_OTA_TOKEN: ${{ secrets.OTA_READ_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve monotonic Android build identity
        id: build_identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          version_code=$((BUILD_VERSION_BASE + GITHUB_RUN_NUMBER))
          release_json="$(mktemp)"
          release_error="$(mktemp)"
          release_exists=true
          if ! gh api "repos/${GITHUB_REPOSITORY}/releases/tags/dev-latest" \
            >"$release_json" 2>"$release_error"; then
            if grep -q '(HTTP 404)' "$release_error"; then
              release_exists=false
            else
              cat "$release_error" >&2
              exit 1
            fi
          fi
          previous_body=""
          if [[ "$release_exists" == true ]]; then
            previous_body="$(jq -r '.body // ""' "$release_json")"
          fi
          previous_code="$(
            printf '%s\n' "$previous_body" \
              | sed -nE 's/^VERSION_CODE:[[:space:]]*([0-9]+)[[:space:]]*$/\1/p' \
              | tail -n 1
          )"
          if [[ "$release_exists" == true && -z "$previous_code" ]]; then
            echo "Existing dev-latest release has no valid VERSION_CODE" >&2
            exit 1
          fi
          if [[ -n "$previous_code" ]] && (( previous_code >= version_code )); then
            version_code=$((previous_code + 1))
          fi
          if (( version_code <= 0 || version_code > 2100000000 )); then
            echo "Resolved Android versionCode is outside the supported range: $version_code" >&2
            exit 1
          fi

          build_tag="dev-${version_code}-${GITHUB_SHA}"
          helper_protocol_version="$(
            sed -nE 's/^readflow\.updateHelperProtocolVersion=([0-9]+)$/\1/p' android/gradle.properties
          )"
          if [[ -z "$helper_protocol_version" ]] || (( helper_protocol_version <= 0 )); then
            echo "Invalid readflow.updateHelperProtocolVersion" >&2
            exit 1
          fi
          echo "BUILD_VERSION_CODE=$version_code" >> "$GITHUB_ENV"
          echo "BUILD_TAG=$build_tag" >> "$GITHUB_ENV"
          echo "HELPER_PROTOCOL_VERSION=$helper_protocol_version" >> "$GITHUB_ENV"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "build_tag=$build_tag" >> "$GITHUB_OUTPUT"
          echo "Resolved BUILD_VERSION_CODE=$version_code"
          echo "Resolved BUILD_TAG=$build_tag"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Run Android regression suites
        working-directory: android
        run: ./gradlew -Preadflow.phase=2 test

      - name: Assemble Android instrumentation test APK
        working-directory: android
        run: ./gradlew -Preadflow.phase=2 :app:assembleDebugAndroidTest

      - name: Build Android instrumentation APKs for manual candidates
        if: ${{ github.event_name == 'workflow_dispatch' }}
        working-directory: android
        run: ./gradlew -Preadflow.phase=2 :app:assembleDebug

      - name: Upload Android instrumentation candidate
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumentation-candidate-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 3

      - name: Upload failed test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-diagnostics-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            android/**/build/test-results/**/TEST-*.xml
            android/**/build/reports/tests/**
          if-no-files-found: warn
          retention-days: 7

      - name: Build OTA APKs
        working-directory: android
        run: ./gradlew -Preadflow.phase=2 :updater-helper:assembleOta :app:assembleOta

      - name: Verify OTA instrumentation runtime closure
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail

          ota_apk="app/build/outputs/apk/ota/app-ota.apk"
          test -s "$ota_apk"

          mapfile -t dex_entries < <(unzip -Z1 "$ota_apk" | grep -E '^classes([0-9]+)?\.dex$' || true)
          if ((${#dex_entries[@]} == 0)); then
            echo "No dex entries found in $ota_apk" >&2
            exit 1
          fi

          found=false
          for dex_entry in "${dex_entries[@]}"; do
            if unzip -p "$ota_apk" "$dex_entry" | strings | grep -F 'Lkotlin/jvm/internal/Intrinsics;' >/dev/null; then
              found=true
              break
            fi
          done

          if [[ "$found" != true ]]; then
            echo "Missing kotlin.jvm.internal.Intrinsics from $ota_apk" >&2
            exit 1
          fi

      - name: Upload Android instrumentation test APK
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumentation-test-apk-${{ github.run_number }}-${{ github.run_attempt }}
          path: android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 3

      - name: Upload unpublished OTA candidates
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish_ota }}
        uses: actions/upload-artifact@v4
        with:
          name: android-ota-candidate-${{ steps.build_identity.outputs.version_code }}
          path: |
            android/app/build/outputs/apk/ota/app-ota.apk
            android/updater-helper/build/outputs/apk/ota/updater-helper-ota.apk
          if-no-files-found: error
          retention-days: 3

      - name: Publish verified dev-latest release
        if: ${{ github.event_name == 'push' || inputs.publish_ota }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          app_apk="android/app/build/outputs/apk/ota/app-ota.apk"
          helper_apk="android/updater-helper/build/outputs/apk/ota/updater-helper-ota.apk"
          test -s "$app_apk"
          test -s "$helper_apk"

          apksigner="$(
            find "${ANDROID_HOME:?}/build-tools" -type f -name apksigner -perm -u+x \
              | sort -V \
              | tail -n 1
          )"
          test -x "$apksigner"
          app_signer="$(
            "$apksigner" verify --print-certs "$app_apk" \
              | sed -nE 's/^.*certificate SHA-256 digest:[[:space:]]*([0-9a-fA-F]+).*$/\1/p' \
              | head -n 1
          )"
          helper_signer="$(
            "$apksigner" verify --print-certs "$helper_apk" \
              | sed -nE 's/^.*certificate SHA-256 digest:[[:space:]]*([0-9a-fA-F]+).*$/\1/p' \
              | head -n 1
          )"
          test -n "$app_signer"
          test "$app_signer" = "$helper_signer"

          version_code="${{ steps.build_identity.outputs.version_code }}"
          stage_dir="$(mktemp -d)"
          verify_dir="$(mktemp -d)"
          app_versioned="$stage_dir/app-ota-${version_code}.apk"
          helper_versioned="$stage_dir/updater-helper-ota-${version_code}.apk"
          cp "$app_apk" "$app_versioned"
          cp "$helper_apk" "$helper_versioned"

          if ! gh release view dev-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create dev-latest \
              --repo "$GITHUB_REPOSITORY" \
              --title "LinReads development release" \
              --notes $'Pending verified assets\n\n---\nVERSION_CODE: 0' \
              --prerelease
          fi

          # Versioned assets are authoritative and immutable. A rerun may reuse an existing pair
          # only when both remote files are byte-identical to this build.
          asset_names="$(
            gh release view dev-latest --repo "$GITHUB_REPOSITORY" \
              --json assets --jq '.assets[].name'
          )"
          app_exists=false
          helper_exists=false
          if grep -Fxq "app-ota-${version_code}.apk" <<<"$asset_names"; then
            app_exists=true
          fi
          if grep -Fxq "updater-helper-ota-${version_code}.apk" <<<"$asset_names"; then
            helper_exists=true
          fi
          if [[ "$app_exists" != "$helper_exists" ]]; then
            echo "Incomplete versioned OTA asset pair for version $version_code" >&2
            exit 1
          fi
          if [[ "$app_exists" == false ]]; then
            gh release upload dev-latest "$app_versioned" "$helper_versioned" \
              --repo "$GITHUB_REPOSITORY"
          fi
          gh release download dev-latest \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "app-ota-${version_code}.apk" \
            --pattern "updater-helper-ota-${version_code}.apk" \
            --dir "$verify_dir"
          cmp "$app_apk" "$verify_dir/app-ota-${version_code}.apk"
          cmp "$helper_apk" "$verify_dir/updater-helper-ota-${version_code}.apk"

          notes_file="$stage_dir/release-notes.txt"
          {
            git log -1 --pretty=%B
            cat <<EOF

          ---
          BUILD_TAG: ${{ steps.build_identity.outputs.build_tag }}
          VERSION_CODE: $version_code
          HELPER_PROTOCOL_VERSION: $HELPER_PROTOCOL_VERSION
          HELPER_VERSION_CODE: $version_code
          Commit: $GITHUB_SHA
          Branch: $GITHUB_REF_NAME
          Workflow run: $GITHUB_RUN_NUMBER
          EOF
          } > "$notes_file"
          gh release edit dev-latest \
            --repo "$GITHUB_REPOSITORY" \
            --title "Dev build #${version_code}" \
            --notes-file "$notes_file" \
            --prerelease

          # Current clients resolve the verified versioned asset from VERSION_CODE. Keep fixed
          # names only as best-effort aliases for legacy clients; they are not release authority.
          if ! gh release upload dev-latest "$app_apk" "$helper_apk" \
            --repo "$GITHUB_REPOSITORY" --clobber; then
            echo "::warning::Legacy fixed-name OTA aliases were not refreshed"
          fi
